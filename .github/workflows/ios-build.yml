name: iOS build (unsigned IPA)

on:
  push:
    branches: ["**"]
    paths:
      - "Tracer/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: Tracer
        run: xcodegen generate

      - name: Build (device, unsigned)
        working-directory: Tracer
        run: |
          set -o pipefail
          xcodebuild \
            -project Tracer.xcodeproj \
            -scheme Tracer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Show compiler errors
        if: failure()
        working-directory: Tracer
        run: grep -E "error:" -A3 xcodebuild.log | head -200 || true

      - name: Package IPA
        working-directory: Tracer
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Tracer-unsigned.ipa Payload
          ls -la Tracer-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Tracer-unsigned-ipa
          path: Tracer/Tracer-unsigned.ipa
          retention-days: 30

  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate project
        working-directory: Tracer
        run: brew install xcodegen && xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']:
                      best=(rt,x['udid'],x['name'])
          print(best[1]); print(best, file=sys.stderr)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        working-directory: Tracer
        run: |
          set -o pipefail
          xcodebuild -project Tracer.xcodeproj -scheme Tracer -configuration Debug -sdk iphonesimulator \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Capture screens
        working-directory: Tracer
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Tracer.app
          BID=com.tracerintelligence.tracer
          mkdir -p shots
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          for LANG in ar en; do
            xcrun simctl uninstall "$UDID" $BID || true
            xcrun simctl install "$UDID" "$APP"
            for SCREEN in splash hub topic assess analysis path log library settings report; do
              xcrun simctl terminate "$UDID" $BID || true
              xcrun simctl launch "$UDID" $BID -uiDemo -screen $SCREEN -lang $LANG
              if [ "$SCREEN" = "splash" ]; then sleep 1.4; else sleep 7; fi
              xcrun simctl io "$UDID" screenshot "shots/${LANG}-${SCREEN}.png"
            done
            xcrun simctl appearance "$UDID" dark
            xcrun simctl terminate "$UDID" $BID || true
            xcrun simctl launch "$UDID" $BID -uiDemo -screen hub -lang $LANG; sleep 6
            xcrun simctl io "$UDID" screenshot "shots/${LANG}-hub-dark.png"
            xcrun simctl terminate "$UDID" $BID || true
            xcrun simctl launch "$UDID" $BID -uiDemo -screen analysis -lang $LANG; sleep 6
            xcrun simctl io "$UDID" screenshot "shots/${LANG}-analysis-dark.png"
            xcrun simctl appearance "$UDID" light
            DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
            cp "$DATA"/Documents/demo-report-*.pdf shots/ || true
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: Tracer/shots
          retention-days: 7
